name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build # tsc -b + vite build

  backend:
    name: Backend lint, types and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: booski
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: booski_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booski -d booski_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      BOOSKI_TEST_DATABASE_URL: postgresql+psycopg://booski:ci-only-password@127.0.0.1:5432/booski_test
      BOOSKI_REQUIRE_DB: "1" # fail, don't skip, if the database tests can't run
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -W error

  container:
    name: Container smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure Compose
        run: echo "BOOSKI_DB_PASSWORD=ci${{ github.run_id }}" > .env
      - name: Build and start
        run: docker compose up --build --detach api
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 60); do
            body=$(curl -fsS http://127.0.0.1:8000/api/v1/health/ready || true)
            if [ "$body" = '{"status":"ok","database":"ok","migrations":"head"}' ]; then
              echo "Ready: $body"; exit 0
            fi
            sleep 2
          done
          echo "API never became ready. Last response: $body"; exit 1
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down --volumes
