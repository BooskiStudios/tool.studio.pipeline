# Booski Studios in containers: PostgreSQL 18 + migrations + the API, which also serves the web app.
# Optional for development (see backend/README.md); CI uses it to prove the container path works,
# and it is the starting point for hosting on a studio server or in the cloud (backend/DEPLOYMENT.md).
#
#   cp .env.example .env    # then set BOOSKI_DB_PASSWORD
#   docker compose up --build
#   → http://127.0.0.1:8000/  (the app)   http://127.0.0.1:8000/api/v1/health/ready  (readiness)

name: booski

x-database-url: &database-url "postgresql+psycopg://booski:${BOOSKI_DB_PASSWORD:?Copy .env.example to .env and set BOOSKI_DB_PASSWORD}@db:5432/booski"

services:
  db:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_USER: booski
      POSTGRES_PASSWORD: ${BOOSKI_DB_PASSWORD:?Copy .env.example to .env and set BOOSKI_DB_PASSWORD}
      POSTGRES_DB: booski
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booski -d booski"]
      interval: 5s
      timeout: 5s
      retries: 12
    # No published port: only the other containers can reach the database.

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["booski", "db", "upgrade"]
    environment:
      BOOSKI_DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      BOOSKI_DATABASE_URL: *database-url
      BOOSKI_ENVIRONMENT: ${BOOSKI_ENVIRONMENT:-development}
      BOOSKI_ANTHROPIC_API_KEY: ${BOOSKI_ANTHROPIC_API_KEY:-} # optional; empty means no AI provider
    ports:
      - "127.0.0.1:8000:8000" # this machine only; put an HTTPS reverse proxy in front before exposing it
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 15s # in-flight requests finish before the container stops

  # Runs queued agent runs (PR 3.4). Same image and database as the API; no ports. The AI key comes from
  # the environment (or a git-ignored .env next to this file); without it, agent runs fail with
  # "provider_not_configured".
  agent-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["booski", "agent-worker"]
    environment:
      BOOSKI_DATABASE_URL: *database-url
      BOOSKI_ENVIRONMENT: ${BOOSKI_ENVIRONMENT:-development}
      BOOSKI_ANTHROPIC_API_KEY: ${BOOSKI_ANTHROPIC_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s # a run stopped mid-step is resumed from its last completed step

volumes:
  pgdata:
